<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Library Project</title>
        <meta name="description" content="TOP library project using HTML, CSS and Javascript" />
        <link rel="stylesheet" href="css/styles.css" />
        <script src="js/main.js" defer></script>
    </head>
    <body>
        <svg class="sprite" aria-hidden="true" focusable="false">
            <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
            <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" /><path d="M21 21l-4.3-4.3" /></symbol>
            <symbol id="icon-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M8 12.5l2.7 2.7L16 9.5" /></symbol>
            <symbol id="icon-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M12 7v5l3 2" /></symbol>
            <symbol id="icon-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 002 2h6a2 2 0 002-2l1-12M9 7V4h6v3" /></symbol>
            <symbol id="icon-book" viewBox="0 0 24 24"><path d="M12 6.5C10 5 7 4.5 3 5v13c4-.5 7 0 9 1.5 2-1.5 5-2 9-1.5V5c-4-.5-7 0-9 1.5zM12 6.5v13" /></symbol>
        </svg>

        <aside class="sidebar">
            <button type="button" id="new-book-btn" class="btn btn--primary">
                <svg class="icon" width="22" height="22"><use href="#icon-plus" /></svg>
                <!-- <img src="images/icon-plus.svg" alt="Add book" class="icon new-book-icon" width="22" height="22" /> -->
                New Book
            </button>

            <section class="sidebar__section">
                <h2 class="sidebar__heading"><label for="search">Search</label></h2>
                <div class="search">
                    <svg class="icon" width="18" height="18" aria-hidden="true"><use href="#icon-search" /></svg>
                    <input type="search" id="search" placeholder="Search by book name or author..." autocomplete="off" />
                </div>
            </section>

            <section class="sidebar__section">
                <h2 class="sidebar__heading">Quick Filters</h2>
                <button type="button" id="filter-read" class="filter-btn filter-btn--read" aria-pressed="false">
                    <svg class="icon" width="24" height="24" aria-hidden="true"><use href="#icon-check" /></svg>
                    Read (<span id="filter-read-count">0</span>)
                </button>
                <button type="button" id="filter-unread" class="filter-btn filter-btn--unread" aria-pressed="false">
                    <svg class="icon" width="24" height="24" aria-hidden="true"><use href="#icon-clock" /></svg>
                    Unread (<span id="filter-unread-count">0</span>)
                </button>
            </section>

            <section class="sidebar__section">
                <h2 class="sidebar__heading"><label for="sort">Sort By</label></h2>
                <select id="sort">
                    <option value="title-asc">Title (A &rarr; Z)</option>
                    <option value="title-desc">Title (Z &rarr; A)</option>
                    <option value="author-asc">Author (A &rarr; Z)</option>
                    <option value="pages-asc">Pages (fewest first)</option>
                    <option value="pages-desc">Pages (most first)</option>
                </select>
            </section>
        </aside>

        <div class="content">
            <header class="page-header">
                <h1 class="page-title">
                    <svg class="icon" width="40" height="40" aria-hidden="true"><use href="#icon-book" /></svg>
                    TOP Library
                </h1>
                <ul class="stats">
                    <li class="stat stat--total">
                        <svg class="icon" width="34" height="34" aria-hidden="true"><use href="#icon-book" /></svg>
                        <span class="stat__text">Total Books <strong id="stat-total">0</strong></span>
                    </li>
                    <li class="stat stat--read">
                        <svg class="icon" width="34" height="34" aria-hidden="true"><use href="#icon-check" /></svg>
                        <span class="stat__text">Read <strong id="stat-read">0</strong></span>
                    </li>
                    <li class="stat stat--unread">
                        <svg class="icon" width="34" height="34" aria-hidden="true"><use href="#icon-clock" /></svg>
                        <span class="stat__text">Unread <strong id="stat-unread">0</strong></span>
                    </li>
                </ul>
            </header>

            <main>
                <p id="results-count" class="results-count" aria-live="polite"></p>
                <div id="book-grid" class="book-grid"></div>
                <p id="empty-state" class="empty-state" hidden></p>
            </main>

            <footer>
                <!-- <p>The Odin Project &middot; Library</p> -->
            </footer>
        </div>

        <dialog id="book-dialog" class="dialog" aria-labelledby="dialog-title">
            <form id="book-form" class="book-form">
                <h2 id="dialog-title">Add a book</h2>

                <label class="field">
                    <span>Title</span>
                    <input type="text" id="title" name="title" required placeholder="The Mountain" />
                </label>

                <label class="field">
                    <span>Author</span>
                    <input type="text" id="author" name="author" required placeholder="Alex Rivers" />
                </label>

                <div class="field-row">
                    <label class="field">
                        <span>Pages</span>
                        <input type="number" id="pages" name="pages" min="1" step="1" required placeholder="320" />
                    </label>

                    <label class="field">
                        <span>Cover</span>
                        <select id="cover" name="cover">
                            <option value="images/covers/default.svg" selected>Book</option>
                            <option value="images/covers/mountain.svg">Mountain</option>
                            <option value="images/covers/tree.svg">Tree</option>
                            <option value="images/covers/moon.svg">Moon</option>
                            <option value="images/covers/leaf.svg">Leaf</option>
                            <option value="images/covers/city.svg">City</option>
                            <option value="images/covers/river.svg">River</option>
                        </select>
                    </label>
                </div>

                <label class="check">
                    <input type="checkbox" id="read" name="read" />
                    <span>I've already read this book</span>
                </label>

                <div class="form-actions">
                    <button type="button" id="cancel-btn" class="btn btn--secondary">Cancel</button>
                    <button type="submit" class="btn btn--primary">Add book</button>
                </div>
            </form>
        </dialog>
    </body>
</html>
